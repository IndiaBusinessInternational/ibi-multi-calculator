name: Sync product catalogue

# Rebuilds catalogue.json from the IBI product master in Google Drive, so a
# name edited in the spreadsheet reaches the live calculator on its own.
# The app reads catalogue.json on every load, so the only lag is this schedule.
#
# GitHub queues cron runs on a best-effort basis — five minutes is the shortest
# interval it accepts, and a busy queue can stretch it. Use "Run workflow" on
# the Actions tab to publish an edit straight away.
#
# NOTE: GitHub disables scheduled workflows in a repository with no commits for
# 60 days, and emails the owner first. Re-enable it from the Actions tab.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'tools/build_catalogue.py'
      - '.github/workflows/sync-catalogue.yml'

permissions:
  contents: write

concurrency:
  group: sync-catalogue
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet openpyxl

      - name: Rebuild catalogue.json from the Drive master
        run: python tools/build_catalogue.py

      # The repo default for GITHUB_TOKEN is read-only; the permissions block
      # above overrides it for this workflow (verified with a --dry-run push).
      - name: Commit and push when it changed
        run: |
          if git diff --quiet -- catalogue.json; then
            echo "catalogue.json unchanged — nothing to publish"
            exit 0
          fi
          count=$(python -c "import json;print(json.load(open('catalogue.json'))['count'])")
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogue.json
          git commit -m "catalogue: sync $count products from the Drive master"
          git push
